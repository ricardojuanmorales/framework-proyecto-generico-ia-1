name: Framework V5 Harden

on:
  push:
    branches:
      - fase3-construccion-v5
    paths:
      - "apps/framework-v5/**"
      - ".github/workflows/framework-v5-harden.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/framework-v5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Normalize npm
        run: npm install --global npm@11.19.0

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install reproducibly
        run: npm ci --ignore-scripts

      - name: Verify
        run: npm run verify

      - name: Build static artifact
        run: npm run build

      - name: Commit lockfile if changed
        working-directory: .
        run: |
          if [ -z "$(git status --porcelain -- apps/framework-v5/package-lock.json)" ]; then
            echo "Lockfile unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/framework-v5/package-lock.json
            git commit -m "build: lock Framework V5 dependencies"
            git push origin HEAD:fase3-construccion-v5
          fi

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: framework-v5-static-build
          path: apps/framework-v5/dist
