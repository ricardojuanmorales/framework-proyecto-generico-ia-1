<circle cx="507" cy="359" r="68" fill="#dff2e2" stroke="#389451" stroke-width="4"/><text x="507" y="347" text-anchor="middle" font-size="34" font-family="Georgia,serif" fill="#1b7239" font-weight="bold">IT</text><text x="507" y="372" text-anchor="middle" font-size="15" font-family="Arial,sans-serif" fill="#1b7239">Investigador</text><text x="507" y="390" text-anchor="middle" font-size="15" font-family="Arial,sans-serif" fill="#1b7239">Transdisciplinario</text>
