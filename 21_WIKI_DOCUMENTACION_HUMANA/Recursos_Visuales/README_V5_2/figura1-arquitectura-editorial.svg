<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" role="img" aria-labelledby="title desc">
<title id="title">Figura 1: arquitectura del Caleidoscopio de la Complejidad</title><desc id="desc">Esquema editorial del Framework: ecología humano, máquina e IA; problema situado al centro; tres lentes PH, IT, AT conectadas de forma no jerárquica; seis principios pedagógicos; pluralidad, contraste y trazabilidad; posible emergencia caleidoscópica; memoria, comunidad y transferencia.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f0f7fd"/><stop offset="1" stop-color="#fdf8f0"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 6 3 0 6Z" fill="#56657a"/></marker></defs>
<rect width="1180" height="660" rx="22" fill="url(#bg)"/><rect x="20" y="16" width="1140" height="91" rx="17" fill="#dbeafb" stroke="#9ebbd3"/>
<text x="590" y="45" font-family="Georgia,serif" font-size="26" text-anchor="middle" fill="#163451" font-weight="bold">Ecología cognitiva gobernada</text><text x="590" y="79" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#22527d">HUMANO  ·  MÁQUINA  ·  IA</text>
<rect x="20" y="120" width="1140" height="432" rx="19" fill="white" stroke="#bdccd6"/>
<text x="590" y="151" font-size="24" font-family="Georgia,serif" font-weight="bold" text-anchor="middle" fill="#1d344a">Framework sociotécnico-transdisciplinario evolutivo</text>
<rect x="36" y="175" width="224" height="324" rx="15" fill="#eff8f0" stroke="#81ad8a"/><text x="148" y="212" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="24" fill="#244a30">Marco pedagógico</text>
<g font-family="Arial,sans-serif" font-size="19" fill="#36544a"><text x="60" y="254">●  Situación</text><text x="60" y="295">●  Participación</text><text x="60" y="336">●  Mediación proporcional</text><text x="60" y="377">●  Reflexión trazable</text><text x="60" y="418">●  Memoria compartida</text><text x="60" y="460">●  Transferencia y evolución</text></g>
<g stroke="#56657a" stroke-width="3.2" fill="none" marker-end="url(#a)"><path d="M666 257 552 330"/><path d="M760 257 887 330"/><path d="M600 354 650 354"/><path d="M854 354 813 354"/><path d="M710 300 710 323"/><path d="M260 342H442"/></g>
